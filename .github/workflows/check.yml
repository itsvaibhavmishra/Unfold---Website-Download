name: Check

# The gate for every change. Builds from a clean checkout and runs the same command used
# locally, so a missing source file or a lint regression fails here rather than at release.

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

# One in-flight run per branch: a newer push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # One invocation, so a single failure surfaces everything rather than stopping at the
      # first task.
      - name: Gate
        run: npm run check

      # The zip is what gets loaded or uploaded, so a build that cannot be packaged fails here.
      - name: Package
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: unfold-zip
          path: unfold.zip
          retention-days: 14
